name: Deploy Client to GitHub Pages

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Vite base and build
        run: |
          REPO=${GITHUB_REPOSITORY#*/}
          VITE_BASE=/$REPO/ npx nx build client --configuration=production
          echo "---- build dist listing ----"
          pwd
          echo "[dist]" && ls -la ./dist || true
          echo "[dist/apps]" && ls -la ./dist/apps || true
          echo "[dist/apps/client]" && ls -la ./dist/apps/client || true
          echo "[disk usage dist/apps/client]" && du -sh ./dist/apps/client || true

      - name: Verify build output
        run: |
          if [ ! -d ./dist/apps/client ]; then
            echo "ERROR: build output ./dist/apps/client is missing"
            echo "Contents of ./dist:" && ls -la ./dist || true
            exit 1
          fi
          echo "Build output exists. Listing:" && ls -la ./dist/apps/client
          echo "Index.html preview:" && sed -n '1,40p' ./dist/apps/client/index.html || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/apps/client
